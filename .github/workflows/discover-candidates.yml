name: Discover AI timeline candidates

on:
  schedule:
    - cron: '27 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/discover-candidates.yml'
      - 'config/discovery-sources.json'
      - 'scripts/discover-candidates.py'
      - 'scripts/test_discover_candidates.py'
      - 'docs/EDITORIAL-REVIEW.md'

permissions:
  contents: read

concurrency:
  group: ai-timeline-discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  shortlist:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test feed handling
        run: python3 -m unittest discover -s scripts -p 'test_discover_candidates.py'
      - name: Fetch public feeds and produce review shortlist
        run: python3 scripts/discover-candidates.py --days 14 --out candidate-review
      - name: Attach editorial gate to review artifacts
        if: always()
        run: |
          mkdir -p candidate-review
          cp docs/EDITORIAL-REVIEW.md candidate-review/
          {
            echo '### 待审候选，不自动入库'
            echo '先看优先复核队列；再回到原始公告、更新日志或论文，核对事件日期、开放对象和阶段。关键细节找第二条证据；证据冲突或不全就留在待审。'
            echo '入库或修订时再人工判断是否影响主题脉络；脉络只引用既有事件 ID，不按厂商或日期自动连线。'
            echo "详见 [审校规则](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/EDITORIAL-REVIEW.md)。"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload review queue (does not publish timeline events)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-timeline-candidates
          path: candidate-review/
          if-no-files-found: warn
          retention-days: 21
